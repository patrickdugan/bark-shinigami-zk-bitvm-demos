name: Prove STWO showcase relations

on:
  workflow_dispatch:
  push:
    branches:
      - fix/stwo-shinigami-enforcement
    paths:
      - .github/workflows/prove-stwo-owner.yml
      - cairo-shinigami/**
      - proof-inputs/**
      - proof-evidence/*.verified-output.json
      - stwo-cairo-binary-verifier.patch
      - stwo-cairo-public-segments.patch

permissions:
  contents: read

concurrency:
  group: stwo-owner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      STWO_CAIRO_COMMIT: b1acf8bfd9fda45e7c2c28553b750f87aefeb9b1
      EXPECTED_OWNER_ARGUMENTS_SHA256: d7d629bfadbd990307930c0c9aade202a746696503cd488f616d75a82779dd8b
      EXPECTED_CHALLENGE_ARGUMENTS_SHA256: dc1e58f1473925abcd4409dacb2019f3c2b2db16d28e00fa8cdee5dd118da691
      EXPECTED_CET_ARGUMENTS_SHA256: 58cdc15ebe5725b3a0b694cde16a83356c1c8ca16c741ca9d80ec7aff2bc807f
      EXPECTED_EXECUTABLE_SHA256: 5b1e4c7c4a545b5ee34c06d672cfa1d4e3e38b732951c60a65a5dcdaba4b5c22
      EXPECTED_BINARY_VERIFIER_PATCH_SHA256: 7a27581bd9b1b50a3c091d4310580636ff853a8e89a5ad7ef4bc6a2f15b87142
      EXPECTED_PATCH_SHA256: ed5027b67ee3798ef2f1467604816cc5efb8e44cedf6083d329ae8f8e4227a71

    steps:
      - name: Check out exact showcase commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Record runner resources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proofs
          {
            lscpu
            free -h
            df -h
          } | tee proofs/runner-resources.txt

      - name: Install Scarb 2.18.0
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd
        with:
          scarb-version: 2.18.0
          cache: false

      - name: Build the pinned Cairo executable
        shell: bash
        run: |
          set -euxo pipefail
          git config --global http.version HTTP/1.1
          cd cairo-shinigami
          scarb fmt --check
          export SCARB_LOG=debug
          for attempt in 1 2 3; do
            if scarb build 2>&1 | tee -a ../proofs/scarb-build.log; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done
          echo "${EXPECTED_EXECUTABLE_SHA256}  target/dev/bark_shinigami_relation.executable.json" \
            | sha256sum --check

      - name: Verify immutable prover inputs
        shell: bash
        run: |
          set -euxo pipefail
          echo "${EXPECTED_OWNER_ARGUMENTS_SHA256}  proof-inputs/owner_exit_allow.arguments.json" | sha256sum --check
          echo "${EXPECTED_CHALLENGE_ARGUMENTS_SHA256}  proof-inputs/owner_exit_challenge.arguments.json" | sha256sum --check
          echo "${EXPECTED_CET_ARGUMENTS_SHA256}  proof-inputs/virtual_cet_guard.arguments.json" | sha256sum --check
          echo "${EXPECTED_BINARY_VERIFIER_PATCH_SHA256}  stwo-cairo-binary-verifier.patch" | sha256sum --check
          echo "${EXPECTED_PATCH_SHA256}  stwo-cairo-public-segments.patch" | sha256sum --check

      - name: Build patched STWO Cairo prover
        shell: bash
        run: |
          set -euxo pipefail
          rustup toolchain install nightly-2025-06-23 --profile minimal
          git clone --filter=blob:none https://github.com/starkware-libs/stwo-cairo.git stwo-cairo
          git -C stwo-cairo checkout "${STWO_CAIRO_COMMIT}"
          git -C stwo-cairo apply --unidiff-zero \
            "${GITHUB_WORKSPACE}/stwo-cairo-public-segments.patch"
          git -C stwo-cairo apply \
            "${GITHUB_WORKSPACE}/stwo-cairo-binary-verifier.patch"
          git -C stwo-cairo diff --check
          cd stwo-cairo/stwo_cairo_prover
          RUSTFLAGS="-C target-cpu=native -C opt-level=3" \
            cargo +nightly-2025-06-23 build --release \
              -p stwo-cairo-dev-utils \
              --bin run_and_prove \
              --bin verify_binary

      - name: Add swap for the memory-bound prover
        shell: bash
        run: |
          set -euxo pipefail
          sudo fallocate -l 24G /swapfile-stwo
          sudo chmod 600 /swapfile-stwo
          sudo mkswap /swapfile-stwo
          sudo swapon /swapfile-stwo
          {
            free -h
            swapon --show
            df -h
          } | tee -a proofs/runner-resources.txt

      - name: Prove valid relations and reject the dishonest relation
        shell: bash
        run: |
          set -uxo pipefail
          mkdir -p proofs
          if /usr/bin/time -v -o proofs/owner_exit_challenge.metrics.txt \
            stwo-cairo/stwo_cairo_prover/target/release/run_and_prove \
              --program cairo-shinigami/target/dev/bark_shinigami_relation.executable.json \
              --program_type executable \
              --program_arguments_file proof-inputs/owner_exit_challenge.arguments.json \
              --proof_path proofs/owner_exit_challenge.stwo.bin \
              --proof-format binary \
              --verify \
              > proofs/owner_exit_challenge.log 2>&1; then
            echo "dishonest owner-exit challenge unexpectedly produced a valid proof" >&2
            exit 1
          fi
          if [ -s proofs/owner_exit_challenge.stwo.bin ]; then
            echo "dishonest owner-exit challenge left a nonempty proof" >&2
            exit 1
          fi

          proof_status=0
          for case_name in owner_exit_allow virtual_cet_guard; do
            set +e
            /usr/bin/time -v -o "proofs/${case_name}.metrics.txt" \
              stwo-cairo/stwo_cairo_prover/target/release/run_and_prove \
                --program cairo-shinigami/target/dev/bark_shinigami_relation.executable.json \
                --program_type executable \
                --program_arguments_file "proof-inputs/${case_name}.arguments.json" \
                --proof_path "proofs/${case_name}.stwo.bin" \
                --proof-format binary \
                --verify
            case_status=$?
            set -e
            if [ "${case_status}" -ne 0 ]; then
              proof_status="${case_status}"
              break
            fi
          done
          if [ "${proof_status}" -eq 0 ]; then
            verifier=stwo-cairo/stwo_cairo_prover/target/release/verify_binary
            "${verifier}" \
              --proof_path proofs/owner_exit_allow.stwo.bin \
              > proofs/owner_exit_allow.verified-output.json
            "${verifier}" \
              --proof_path proofs/virtual_cet_guard.stwo.bin \
              > proofs/virtual_cet_guard.verified-output.json
            diff -u \
              proof-evidence/owner_exit_allow.verified-output.json \
              proofs/owner_exit_allow.verified-output.json
            diff -u \
              proof-evidence/virtual_cet_guard.verified-output.json \
              proofs/virtual_cet_guard.verified-output.json

            cp proofs/owner_exit_allow.stwo.bin proofs/owner_exit_allow.appended.stwo.bin
            printf 'attacker-trailer' >> proofs/owner_exit_allow.appended.stwo.bin
            if "${verifier}" \
              --proof_path proofs/owner_exit_allow.appended.stwo.bin \
              > proofs/owner_exit_allow.appended.log 2>&1; then
              echo "proof with bytes after bzip2 stream unexpectedly verified" >&2
              exit 1
            fi
            rm proofs/owner_exit_allow.appended.stwo.bin

            {
              bunzip2 -c proofs/owner_exit_allow.stwo.bin
              printf 'attacker-trailer'
            } | bzip2 -c > proofs/owner_exit_allow.bincode-trailer.stwo.bin
            if "${verifier}" \
              --proof_path proofs/owner_exit_allow.bincode-trailer.stwo.bin \
              > proofs/owner_exit_allow.bincode-trailer.log 2>&1; then
              echo "proof with bytes after bincode object unexpectedly verified" >&2
              exit 1
            fi
            rm proofs/owner_exit_allow.bincode-trailer.stwo.bin

            cp proofs/owner_exit_allow.stwo.bin proofs/owner_exit_allow.tampered.stwo.bin
            original_byte="$(od -An -tu1 -j 512 -N 1 proofs/owner_exit_allow.tampered.stwo.bin)"
            mutated_byte="$((original_byte ^ 1))"
            printf "\\$(printf '%03o' "${mutated_byte}")" \
              | dd of=proofs/owner_exit_allow.tampered.stwo.bin \
                  bs=1 seek=512 count=1 conv=notrunc status=none
            if "${verifier}" \
              --proof_path proofs/owner_exit_allow.tampered.stwo.bin \
              > proofs/owner_exit_allow.tampered.log 2>&1; then
              echo "tampered serialized proof unexpectedly verified" >&2
              exit 1
            fi
            rm proofs/owner_exit_allow.tampered.stwo.bin

            sha256sum \
              cairo-shinigami/target/dev/bark_shinigami_relation.executable.json \
              proof-inputs/owner_exit_allow.arguments.json \
              proof-inputs/owner_exit_challenge.arguments.json \
              proof-inputs/virtual_cet_guard.arguments.json \
              proofs/owner_exit_allow.stwo.bin \
              proofs/owner_exit_allow.verified-output.json \
              proofs/virtual_cet_guard.stwo.bin \
              proofs/virtual_cet_guard.verified-output.json \
              stwo-cairo-binary-verifier.patch \
              stwo-cairo-public-segments.patch \
              | tee proofs/SHA256SUMS
          fi
          cat proofs/*.metrics.txt || true
          exit "${proof_status}"

      - name: Upload verified proof and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-exit-stwo-${{ github.sha }}
          path: |
            proofs/**
            cairo-shinigami/target/dev/bark_shinigami_relation.executable.json
            proof-inputs/owner_exit_allow.arguments.json
            stwo-cairo-public-segments.patch
          if-no-files-found: warn
          retention-days: 14
